[package]
name = "cdm-linker"
version = "0.0.1"
description = "CdM-16 Rust linker"
license = "MIT OR Apache-2.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = {version = "0.3.0", features = ["std"] }
clap = { version = "4.3", features = ["derive"] }
thiserror = "1.0.24"
ar = "0.9.0"
strip-ansi-escapes = "0.2.1"
