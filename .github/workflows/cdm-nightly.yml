name: '[CDM] Nightly build'

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *" # every day 21:00 UTC (4:00 UTC+7)

jobs:
  build:
    uses: ./.github/workflows/cdm-build.yml
    with:
      upload: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create subfolder
        run: mkdir artifacts_download
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts_download
      - name: Update Nightly Release
        uses: andelf/nightly-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: cdm-nightly
          name: 'CDM Nightly'
          body: 'Nightly releases are made every night. They contain the newest features and fixes, but may be unstable.'
          prerelease: true
          files: |
            ${{github.workspace}}/artifacts_download/*/*.tar.gz
