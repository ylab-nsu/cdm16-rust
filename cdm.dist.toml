change-id = 144675

[build]
build-stage = 2
docs = false
compiler-docs = false
submodules = false

[rust]
channel = "dev"
lld = true

[llvm]
download-ci-llvm = false
optimize = true
assertions = true
ninja = true
targets = "X86"
experimental-targets = "CDM"
link-jobs = 2
link-shared = false
version-suffix = "-rust-cdm"

[target.x86_64-unknown-linux-gnu]
cc = "clang"
cxx = "clang++"
llvm-has-rust-patches = false

[dist]
compression-profile = "balanced"
compression-formats = ["gz"]
src-tarball = false
